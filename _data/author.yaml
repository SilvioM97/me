bio:
  - >
    I'm a computer scientist with a Math background. I work on making search faster and more scalable,
    one of the real bottlenecks in AI right now.
  - >
    I'm wrapping up a PhD focused on efficiency in Information Retrieval and Vector Search, and at the same time
    working as a Research Engineer at <a class="underline hover:no-underline text-sky-700" href="https://weaviate.io/" target="_blank" rel="noopener">Weaviate</a>,
    because I wanted my work tested against problems that only show up at production scale.
  - >
    During my PhD I co-founded <a class="underline hover:no-underline text-sky-700" href="https://tuskanny.com" target="_blank" rel="noopener">tusKANNy</a>,
    a research group built around one goal: making vector search efficient, and shipping the fastest open source
    and production-ready retrieval libraries.

